<body>

<div class="card">

<h2>Sales Insight Automator</h2>

<input type="file" id="file"/>

<input type="email" id="email" placeholder="Enter your email"/>

<button onclick="upload()">Generate Summary</button>

<div id="result"></div>

</div>

<script>

async function upload(){

  const file = document.getElementById("file").files[0];
  const email = document.getElementById("email").value;

  if(!file || !email){
    alert("Please select file and email");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("email", email);

  document.getElementById("result").innerText="Processing...";

  try{

    const response = await fetch(
      "https://sales-insight-automator-backend-9eg7.onrender.com/api/upload",
      {
        method:"POST",
        body:formData
      }
    );

    const data = await response.json();

    document.getElementById("result").innerText =
      data.summary || JSON.stringify(data,null,2);

  }catch(error){

    document.getElementById("result").innerText="Error occurred";

  }

}

</script>

</body>
